openapi: 3.1.0
info:
  title: Project & Task Management API
  description: API for managing users, projects, tasks, comments, change history, attachments, and time tracking. Supports roles, notifications, and the full task lifecycle.
  version: 1.0.0
servers:
  - url: "http://localhost:8080"


tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management
  - name: Projects
    description: Project CRUD operations
  - name: Tasks
    description: Task CRUD operations
  - name: Time Entries
    description: Time tracking for tasks
  - name: Comments
    description: Comments on tasks
  - name: Task History
    description: History of task changes
  - name: Notifications
    description: User notifications
  - name: Attachments
    description: File attachments for tasks

paths:
  # AUTH
  /auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /auth/signup:
    post:
      summary: Register new user
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    # USERS
  /users:
    get:
      summary: Get all users
      tags:
        - Users
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      summary: Create new user
      tags:
        - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"


  /users/{userId}:
    get:
      summary: Get user by ID
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    put:
      summary: Update user
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        200:
          description: Updated

    delete:
      summary: Delete user
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        204:
          description: Deleted

    # PROJECTS
  /projects:
    get:
      summary: Get all projects
      tags:
        - Projects
      responses:
        200:
          description: OK

    post:
      summary: Create new project
      tags:
        - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        201:
          description: Created

  /projects/{projectId}:
      get:
        summary: Get project by ID
        tags:
          - Projects
        parameters:
          - $ref: "#/components/parameters/projectId"
        responses:
          200:
            description: OK

      put:
        summary: Update project
        tags:
          - Projects
        parameters:
          - $ref: "#/components/parameters/projectId"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdateRequest"
        responses:
          200:
            description: Updated

      delete:
        summary: Delete project
        tags:
          - Projects
        parameters:
          - $ref: "#/components/parameters/projectId"
        responses:
          204:
            description: Deleted

    # TASKS
  /tasks:
    get:
      summary: Get all tasks
      tags:
        - Tasks
      responses:
        200:
          description: OK

    post:
      summary: Create new task
      tags:
        - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        201:
          description: Created

  /tasks/{taskId}:
      get:
        summary: Get task by ID
        tags:
          - Tasks
        parameters:
          - $ref: "#/components/parameters/taskId"
        responses:
          200:
            description: OK

      put:
        summary: Update task
        tags:
          - Tasks
        parameters:
          - $ref: "#/components/parameters/taskId"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUpdateRequest"
        responses:
          200:
            description: Updated

      delete:
        summary: Delete task
        tags:
          - Tasks
        parameters:
          - $ref: "#/components/parameters/taskId"
        responses:
          204:
            description: Deleted

  /tasks/{taskId}/time-entries:
    get:
      summary: Get time entries for task
      tags:
        - Time Entries
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK

    post:
      summary: Create time entry
      tags:
        - Time Entries
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryCreateRequest"
      responses:
        201:
          description: Created

    # COMMENTS
  /tasks/{taskId}/comments:
    get:
      summary: Get comments for task
      tags:
        - Comments
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK

    post:
      summary: Add comment
      tags:
        - Comments
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        201:
          description: Created


    # TASK HISTORY
  /tasks/{taskId}/history:
    get:
      summary: Get task history
      tags:
        - Task History
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK

    # NOTIFICATIONS
  /users/{userId}/notifications:
    get:
      summary: Get notifications for user
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        200:
          description: OK

  /notifications/{notificationId}/read:
    put:
      summary: Mark notification as read
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/notificationId"
      responses:
        200:
          description: Updated

    # ATTACHMENTS
  /tasks/{taskId}/attachments:
    get:
      summary: Get attachments for task
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        200:
          description: OK

    post:
      summary: Upload attachment
      tags:
        - Attachments
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCreateRequest"
      responses:
        201:
          description: Created


components:
  # PARAMETERS
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  # SCHEMAS
  schemas:
    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true

    SignUpRequest:
        type: object
        required: [ first_name, last_name, email, password, phone_number ]
        properties:
          first_name:
            type: string
          last_name:
            type: string
          email:
            type: string
            format: email
          password:
            type: string
            format: password
          phone_number:
            type: string
          role:
            type: string

    TokenResponse:
        type: object
        required: [ token ]
        properties:
          token:
            type: string
          tokenType:
            type: string
            example: Bearer
          expiresIn:
            type: integer
            example: 3600

      # USERS
    User:
        type: object
        properties:
          id:
            type: string
            format: uuid
          first_name:
            type: string
          last_name:
            type: string
          email:
            type: string
          phone_number:
            type: string
          role:
            type: string

    UserCreateRequest:
        type: object
        required: [ first_name, last_name, email, password, phone_number, role ]
        properties:
          first_name:
            type: string
          last_name:
            type: string
          email:
            type: string
          password:
            type: string
          phone_number:
            type: string
          role:
            type: string

    UserUpdateRequest:
        type: object
        properties:
          first_name:
            type: string
          last_name:
            type: string
          phone_number:
            type: string
          role:
            type: string

      # PROJECTS
    Project:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          description:
            type: string
          created_by:
            type: string
            format: uuid

    ProjectCreateRequest:
        type: object
        required: [ name, description, created_by ]
        properties:
          name:
            type: string
          description:
            type: string
          created_by:
            type: string
            format: uuid

    ProjectUpdateRequest:
        type: object
        properties:
          name:
            type: string
          description:
            type: string

      # TASKS
    Task:
        type: object
        properties:
          id:
            type: string
            format: uuid
          project_id:
            type: string
            format: uuid
          title:
            type: string
          description:
            type: string
          status:
            type: string
          priority:
            type: string
          created_by:
            type: string
            format: uuid
          assigned_to:
            type: string
            format: uuid

    TaskCreateRequest:
        type: object
        required:
          - project_id
          - title
          - description
          - status
          - priority
          - created_by
          - assigned_to
        properties:
          project_id:
            type: string
            format: uuid
          title:
            type: string
          description:
            type: string
          status:
            type: string
          priority:
            type: string
          created_by:
            type: string
            format: uuid
          assigned_to:
            type: string
            format: uuid

    TaskUpdateRequest:
        type: object
        properties:
          title:
            type: string
          description:
            type: string
          status:
            type: string
          priority:
            type: string
          assigned_to:
            type: string
            format: uuid

      # TIME ENTRIES
    TimeEntryCreateRequest:
        type: object
        required: [ user_id, start_time ]
        properties:
          user_id:
            type: string
            format: uuid
          start_time:
            type: string
            format: date-time
          end_time:
            type: string
            format: date-time

      # COMMENTS
    CommentCreateRequest:
        type: object
        required: [ user_id, message ]
        properties:
          user_id:
            type: string
            format: uuid
          message:
            type: string

      # ATTACHMENTS
    AttachmentCreateRequest:
        type: object
        required: [ file_url, uploaded_by ]
        properties:
          file_url:
            type: string
          uploaded_by:
            type: string
            format: uuid

      # ERROR
    Error:
        type: object
        properties:
          message:
            type: string


